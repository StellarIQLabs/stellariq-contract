[package]
name = "stellariq-router"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellariq-interfaces = { path = "../../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellariq-interfaces = { path = "../../interfaces" }
stellariq-test-adapter = { path = "../test-adapter" }
